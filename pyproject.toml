[project]
name = "draft-tools"
version = "0.1.0"
description = "Outline-to-draft tools for blog posts in the vault: a drafting scaffold, and talk-the-post (voice memo into the outline's sections, in your own words)."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "click<8.3.2",  # 8.3.2 breaks typer 0.24.1's option parsing (same pin as process-doctor)
    "rich>=14.3.3",
    "pydantic>=2.0",
    "local-first-common",
]

[project.optional-dependencies]
voice = ["mlx-whisper>=0.4.0"]

[project.scripts]
draft = "draft_tools.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draft_tools"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
local-first-common = { git = "https://github.com/jamalhansen/local-first-common.git", branch = "main" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
